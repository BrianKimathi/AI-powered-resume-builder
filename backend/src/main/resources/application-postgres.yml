server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ai-resume-builder-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/resumedb
    username: postgres
    password: 2951
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
