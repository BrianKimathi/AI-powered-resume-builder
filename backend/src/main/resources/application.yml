server:
  port: 8081

spring:
  application:
    name: ai-resume-builder-backend

  # Fallback to H2 database if local PostgreSQL database 'resumedb' is not created or password differs
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:resumedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# JWT Security Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 Hours
    refresh-expiration-ms: 604800000 # 7 Days

# Paystack Payment Gateway Config
paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:sk_test_mock_paystack_secret_key}
  public-key: ${PAYSTACK_PUBLIC_KEY:pk_test_mock_paystack_public_key}
  base-url: https://api.paystack.co

# AI Service Configuration
ai:
  provider: ${AI_PROVIDER:gemini} # 'openai' or 'gemini'
  openai:
    api-key: ${OPENAI_API_KEY:mock-openai-key}
    model: gpt-4o-mini
  gemini:
    api-key: ${GEMINI_API_KEY:your-gemini-api-key-here}
    model: gemini-1.5-flash

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:3000}
