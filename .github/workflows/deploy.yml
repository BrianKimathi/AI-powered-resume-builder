name: CI/CD Automated Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Spring Boot + React + Admin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        run: mvn clean test -B

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend User Application
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Build Admin Panel Dashboard
        working-directory: ./admin-panel
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to AWS EC2 via SSH
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "==== Starting Deployment on Remote Server ===="
            cd ${{ secrets.APP_DIR }}
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker image prune -f
            echo "==== Deployment Successful! Running Containers: ===="
            docker ps --filter "name=resumai"
